<style>
:root{--ink:#202731;--sub:#7c8490;--bg:#f5f6f8;--line:#e6e8ed;--orange:#ee704b;--nav:#17232d;--accent:#fdf0ea;--shadow:0 12px 36px #1524320b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible{outline:3px solid #eaaa86;outline-offset:3px}button{border:0;background:none;color:inherit}input,select{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:#fff;color:var(--ink);min-width:0}input:focus,select:focus{outline:2px solid #edb7a4;outline-offset:1px}a{color:inherit}header{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:42px;padding:0 4.5%;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px;font-size:23px;font-weight:850;letter-spacing:-1px}.logo{background:var(--nav);color:white;border-radius:10px;width:34px;height:34px;display:grid;place-content:center;font-size:20px;letter-spacing:0}.brand small{font-size:10px;letter-spacing:2px;font-weight:600;color:var(--sub);margin-left:3px}nav{display:flex;gap:28px;height:100%}nav button{position:relative;color:var(--sub);font-weight:650;padding:0 2px}nav button.active{color:var(--ink)}nav button.active:after{content:"";position:absolute;bottom:0;left:0;right:0;background:var(--orange);height:3px}.head-right{margin-left:auto;display:flex;gap:12px;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:9px;font-weight:650;white-space:nowrap;border:1px solid var(--line);background:#fff;line-height:1.5}.btn:hover{background:#f1f2f5}.btn.primary{background:var(--nav);border-color:var(--nav);color:white}.btn.primary:hover{background:#2d414e}.btn.orang play:flex;gap:3px;background:#eaedf0;border-radius:9px;padding:4px}.sort button{padding:6px 13px;border-radius:6px;font-size:12px;color:var(--sub)}.sort button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #00000008}.list-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.list-card{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 2px 4px #00000002;transition:transform .15s,box-shadow .15s;cursor:pointer}.list-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.preview{background:#eef0f3;padding:18px;height:162px;display:flex;flex-direction:column;gap:4px}.preview-row{display:flex;height:26px;gap:4px}.preview-label{width:32px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:750;border-radius:3px;padding:2px}.preview-track{display:flex;gap:3px;overflow:hidden;flex:1;background:#e4e7ec;border-radius:3px;padding:2px}.mini-card{width:27px;flex-shrink:0;background:#141414;color:#fff;display:flex;align-items:center;justify-content:center;font-size:5px;overflow:hidden;border-radius:2px;text-align:center;line-height:1.15}.mini-card img{width:100%;height:100%;object-fit:cover}.card-content{padding:17px 18px}.card-content h3{margin:7px 0 10px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.4px}.badge{background:#f0f3f5;color:#71808e;border-radius:4px;font-size:10px;padding:3px 7px}.badge.public{background:#eef5ef;color:#5c8b65}.card-meta{display:flex;align-items:center;justify-content:space-between;color:var(--sub);font-size:11px}.avatar{background:#e8ebef;color:#637181;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;font-size:10px;margin-right:6px}.card-footer{display:flex;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.empty{border:1px dashed #d4d9df;border-radius:14p ent:center;align-items:center;padding:10px;gap:12px}.tier-name{font-size:23px;font-weight:800;text-align:center;word-break:break-word;line-height:1.2;cursor:default}.editable .tier-name{cursor:text}.tier-tools{display:flex;gap:3px;opacity:.5}.tier-side:hover .tier-tools{opacity:1}.tier-tools button{font-size:13px;padding:1px 4px;border-radius:4px}.tier-tools button:hover{background:#ffffff60}.tier-zone{flex:1;min-width:0;display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;align-content:flex-start;padding:13px;min-height:140px;transition:background .15s}.tier-zone.over{background:#fff2e9;box-shadow:inset 0 0 0 2px #efac90}.tier-hint{font-size:12px;color:#b6bdc7;align-self:center;pointer-events:none;margin:0 auto}.movie-card{width:77px;height:110px;background:#101114;border-radius:5px;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 2px 5px #0002;cursor:grab}.movie-card.dragging{opacity:.35}.movie-card img{width:100%;height:100%;object-fit:cover;border-radius:5px;pointer-events:none}.movie-text{padding:9px;font-size:12px;font-weight:650;text-align:center;word-break:break-word;max-height:100%;overflow:hidden;pointer-events:none}.movie-controls{position:absolute;top:3px;right:3px;left:3px;display:flex;justify-content:space-between;opacity:0}.movie-card:hover .movie-controls,.movie-card:focus-within .movie-controls{opacity:1}.movie-controls button{border-radius:3px;background:#111b;color:white;font-size:11px;padding:2px 5px;line-height:1.5}.movie-card.insert-before{box-shadow:-4px 0 0 var(--orange)}.pool{margin-top:22px}.pool-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px}.pool h3{margin:0;font-size:14px}.pool .tier-zone{border:1px dashed #ccd3dc;border-radius:10px;background:#eff1f4;min-height:140px}.bottom-note{margin:14px 0;color:#939aa5;font-size:12px}.copy-notice{padding:13px 17px;background:#fff4e9;border:1px solid #f5deca;border-radius:9px;color:#a3724b;margin-bottom:20px;font-size:13px}.account-banner{background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:18px;padding:24px;margin-bottom:25px}.account-banner .avatar{width:52px;height:52px;font-size:21px;background:var(--nav);color:white}.account-banner h1{font-size:23px;margin:0}.account-banner p{margin:2px 0;color:var(--sub);font-size:12px}.account-numbers{margin-left:auto;display:flex;gap:30px;text-align:center}.account-numbers b{font-size:23px;display:block}.account-numbers span{font-size:11px;color:var(--sub)}dialog{border:1px solid var(--line);border-radius:17px;padding:0;width:460px;max-width:calc(100% - 30px);box-shadow:0 24px 100px #0003;color:var(--ink)}dialog::backdrop{background:#13212c80;backdrop-filter:blur(3px)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:23px 25px 0}.modal-head h2{font-size:20px;margin:0;letter-spacing:-.5px}.close{font-size:24px;line-height:1;padding:4px;color:var(--sub)}.modal-body{padding:18px 25px 25px}.modal-body p{font-size:13px;color:var(--sub);margin-top:0}.field{display:flex;flex-direction:column;gap:7px;margin:16px 0}.field label{font-size:12px;font-weight:700}.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:23px}.account-choice{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;text-align:left}.account-choice:hover{background:var(--bg)}.divider{font-size:11px;color:var(--sub);margin:20px 0 10px}.notice{background:#f6f3ee;padding:12px;border-radius:8px;font-size:12px;color:#8a7862;line-height:1.7}.share-field{width:100%;font-size:12px}.error{color:#bd4747;font-size:12px;margin-top:10px}.help-list{padding-left:19px;font-size:13px;line-height:1.9;color:#64707d}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#17232df5;color:#fff;border-radius:10px;padding:13px 22px;box-shadow:0 5px 28px #0002;z-index:100;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.hide{display:none!important}.drop-upload{position:fixed;inset:10px;border:3px dashed var(--orange);border-radius:18px;z-index:90;background:#fff8f0f2;display:none;place-content:center;text-align:center;pointer-events:none;font-size:23px;font-weight:750}.storage-warning{background:#fff1e9;color:#9c5236;padding:12px 20px;font-size:12px;text-align:center}.file-label{cursor:pointer}.help-link{text-decoration:underline;text-underline-offset:3px;padding:0;font-size:inherit}.loading{opacity:.6;pointer-events:none}@media(min-width:1500px){main{padding-top:50px}}@media(max-width:1000px){.list-grid{grid-template-columns:repeat(2,1fr)}.hero-art{width:240px}header{gap:25px}main{padding:30px 25px}.editor-top{flex-direction:column}.editor-actions{justify-content:flex-start}.brand small{display:none}}@media(max-width:650px){header{height:65px;padding:0 16px;gap:20px}.brand{font-size:20px}.logo{width:29px;height:29px;font-size:17px}nav{gap:15px}nav button{font-size:12px}.head-right .btn{padding:7px 10px;font-size:12px}.head-right .new-head{display:none}.head-right{gap:0}main{padding:24px 16px 40px}.hero{padding:27px 25px;min-height:0}.hero h1{font-size:27px}.hero p{font-size:12px}.hero-art{display:none}.stats{gap:14px;font-size:10px}.list-grid{grid-template-columns:1fr}.section-head h2{font-size:19px}.toolbar{gap:8px}.sort button{padding:6px 9px}.search{max-width:none}.search input{font-size:12px}.tier-side{width:65px;padding:7px}.tier-name{font-size:19px}.tier-zone{padding:10px;gap:8px;min-height:128px}.tier-row{min-height:128px}.movie-card{width:65px;height:95px}.movie-controls{opacity:1}.tier-tools{opacity:.8}.edit-bar{align-items:flex-start;flex-direction:column}.title-input{font-size:24px}.editor-actions{gap:6px}.editor-actions .btn{font-size:12px;padding:8px 12px}.account-banner{flex-wrap:wrap;padding:18px;gap:10px}.account-numbers{width:100%;margin-left:0;justify-content:space-around;margin-top:10px;border-top:1px solid var(--line);padding-top:12px}.footer{flex-direction:column;gap:7px}.info{font-size:11px}.tier-hint{font-size:10px}.pool-head .muted{font-size:10px}}

<body>
<header><button class="brand" onclick="go('explore')" aria-label="프레임 홈"><span class="logo">▤</span>프레임<small>FRAME</small></button><nav aria-label="주 메뉴"><button id="nav-explore" onclick="go('explore')">공개 탐색</button><button id="nav-mine" onclick="go('mine')">내 리스트</button></nav><div class="head-right"><button class="btn primary new-head" onclick="createList()">＋ 새 리스트</button><button class="btn" id="account-btn" onclick="accountDialog()">로그인</button></div></header>
<div id="storage-warning" class="storage-warning hide">브라우저 저장 공간을 사용할 수 없습니다. 이 세션에서만 유지됩니다. 작업 후 파일로 내보내 주세요.</div>
<main id="app"></main>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button class="close" onclick="closeModal()" aria-label="닫기">×</button></div><div class="modal-body" id="modal-body"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div><div class="drop-upload" id="drop-upload">이미지를 놓아 영화 카드로 추가하세요</div>
<input type="file" id="image-input" accept="image/*" multiple hidden><input type="file" id="import-input" accept=".json,application/json" hidden>
<script>
'use strict';
const KEY='frame_movie_tiers_v1',COLORS=['#f2a1a4','#f5bc99','#f3d79a','#e5e7a1','#aad5b1','#abc9e9'];
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
let db={users:[],lists:[],current:null},storageOK=true,page='explore',sort='new',search='',draft=null,shared=false,dirty=false,dragId=null,afterLogin=null,toastTimer;
try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(Array.isArray(d.users)&&Array.isArray(d.lists))db=d;}localStorage.setItem(KEY,JSON.stringify(db));}catch(e){storageOK=false;$('#storage-warning').classList.remove('hide');}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;$('#storage-warning').classList.add('hide');return true;}catch(e){storageOK=false;$('#storage-warning').classList.remove('hide');toast('저장 공간이 부족하거나 사용할 수 없습니다. JSON 파일로 내보내 주세요.');return false;}}
function user(){return db.users.find(u=>u.id===db.current)||null}function owner(l){return db.users.find(u=>u.id===l.owner)?.name||l.author||'알 수 없음'}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3400)}
function modal(title,body){$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;if(!$('#modal').open)$('#modal').showModal();setTimeout(()=>$('#modal-body input')?.focus(),30)}function closeModal(){$('#modal').close();afterLogin=null}
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
function footer(){return `<div class="footer"><span>FRAME / 프레임 · 취향을 기록하는 가장 나다운 방법</span><span>오프라인 로컬 버전 <span aria-hidden="true">·</span> <button class="help-link" onclick="help()">사용 안내 및 제한</button></span></div>`}
function header(){const u=user();$('#account-btn').textContent=u?u.name+' 님':'로그인';$('#nav-explore').classList.toggle('active',page==='explore');$('#nav-mine').classList.toggle('active',page==='mine')}
function leave(){if(dirty&&!confirm('저장하지 않은 변경 사항이 있습니다. 이동하면 변경 사항이 사라집니다. 계속할까요?'))return false;dirty=false;return true}
function clearHash(){if(location.hash){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''}}}
function go(p){if(!leave())return;clearHash();page=p;draft=null;shared=false;search='';render();window.scrollTo(0,0)}
function render(){header();if(page==='editor')renderEditor();else if(page==='mine')renderMine();else renderExplore()}
function count(l){return l.tiers.reduce((a,t)=>a+t.cards.length,0)+(l.pool?.length||0)}
function heroArt(){return `<div class="hero-art" aria-hidden="true">${['S','A','B','C'].map((t,i)=>`<div class="art-row"><div class="art-label" style="background:${COLORS[i]}">${t}</div><div class="art-track">${Array.from({length:[3,5,4,2][i]},()=>'<div class="art-card"></div>').join('')}</div></div>`).join('')}</div>`}
function renderExplore(){$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">YOUR MOVIES, YOUR RANKING</div><h1>좋은 영화는 기억에,<br>나의 취향은 티어리스트에.</h1><p>영화 한 편 한 편, 당신만의 기준으로 정리해 보세요.</p><button class="btn orange" onclick="createList()">＋ 나만의 리스트 만들기</button><div class="stats"><span><i class="dot"></i>자유로운 티어 편집</span><span><i class="dot"></i>내 취향을 담은 공유</span></div></div>${heroArt()}</section><section><div class="section-head"><div><h2>공개 리스트 둘러보기 <span class="muted tiny" id="result-count"></span></h2><p>다양한 취향 속에서 다음 영화를 발견해 보세요.</p></div><button class="btn small" onclick="importStart()">↥ 파일 가져오기</button></div><div class="toolbar"><div class="search"><span aria-hidden="true">⌕</span><input id="search" placeholder="리스트 제목 또는 작성자로 검색" aria-label="공개 리스트 검색" oninput="search=this.value;renderCards()"></div><div class="sort"><button id="sort-new" onclick="setSort('new')">최신순</button><button id="sort-popular" onclick="setSort('popular')">인기순</button></div></div><div class="list-grid" id="cards"></div></section><div class="info"><span>ⓘ</span><div><strong>나의 브라우저 안에 있는 작은 영화 공간</strong><br>공개 탐색에는 이 브라우저에서 공개한 리스트만 표시됩니다. 다른 사람의 리스트는 공유 링크나 JSON 파일로 열 수 있습니다. 실제 온라인 계정·전 세계 공개 검색·통합 조회수는 서버가 필요한 기능입니다.</div></div>${footer()}`;renderCards()}
function setSort(v){sort=v;renderCards()}
function preview(l){return `<div class="preview" aria-hidden="true">${l.tiers.slice(0,4).map((t,i)=>`<div class="preview-row"><span class="preview-label" style="background:${COLORS[i%6]}">${esc(t.name)}</span><div class="preview-track">${t.cards.slice(0,11).map(c=>`<div class="mini-card">${c.image?`<img src="${esc(c.image)}" alt="">`:esc(c.title)}</div>`).join('')}</div></div>`).join('')}</div>`}
function card(l,mine=false){return `<article class="list-card" tabindex="0" role="button" aria-label="${esc(l.title)} 열기" onclick="openList('${l.id}')" onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();openList('${l.id}')}">${preview(l)}<div class="card-content"><span class="badge ${l.public?'public':''}">${l.public?'공개 리스트':'링크로만 공유'}</span><h3>${esc(l.title)}</h3><div class="card-meta"><span><span class="avatar">${esc(owner(l).slice(0,1))}</span>${esc(owner(l))}</span><span>${count(l)}편 · 조회 ${l.views||0}</span></div>${mine?`<div class="card-footer"><button class="btn small" onclick="event.stopPropagation();openList('${l.id}')">편집하기</button><button class="btn small" onclick="event.stopPropagation();shareSaved('${l.id}')">공유</button><button class="btn small danger" style="margin-left:auto" onclick="event.stopPropagation();deleteList('${l.id}')">삭제</button></div>`:''}</div></article>`}
function renderCards(){let ls=db.lists.filter(l=>l.public);let q=search.trim().toLocaleLowerCase();if(q)ls=ls.filter(l=>(l.title+' '+owner(l)).toLocaleLowerCase().includes(q));ls.sort(sort==='popular'?(a,b)=>(b.views||0)-(a.views||0)||b.updated-a.updated:(a,b)=>b.updated-a.updated);$('#result-count').textContent=ls.length;$('#sort-new').classList.toggle('active',sort==='new');$('#sort-popular').classList.toggle('active',sort==='popular');$('#cards').innerHTML=ls.length?ls.map(l=>card(l)).join(''):`<div class="empty"><div class="empty-symbol">▤</div><h3>${q?'검색 결과가 없습니다':'첫 번째 취향을 남겨 주세요'}</h3><p>${q?'다른 제목이나 작성자 이름으로 검색해 보세요.':'아직 공개된 리스트가 없어요. 내 리스트를 만들고 공개 탐색에 등록해 보세요.'}</p>${q?'':'<button class="btn primary" onclick="createList()">＋ 첫 리스트 만들기</button>'}</div>`}
function renderMine(){let u=user();if(!u){$('#app').innerHTML=`<div class="section-head"><div><div class="eyebrow">MY COLLECTION</div><h2>나의 영화 취향 보관함</h2></div></div><div class="empty"><div class="empty-symbol">♙</div><h3>계정을 선택하고 기록을 시작하세요</h3><p>이 브라우저에 여러 로컬 계정을 만들고, 각자의 리스트를 따로 관리할 수 있습니다.</p><button class="btn primary" onclick="accountDialog()">로컬 계정으로 시작하기</button></div>${footer()}`;return}let ls=db.lists.filter(l=>l.owner===u.id).sort((a,b)=>b.updated-a.updated);$('#app').innerHTML=`<div class="account-banner"><span class="avatar">${esc(u.name.slice(0,1))}</span><div><div class="eyebrow">MY COLLECTION</div><h1>${esc(u.name)} 님의 영화 기록</h1><p>나만의 시선으로 쌓아가는 영화 취향</p></div><div class="account-numbers"><div><b>${ls.length}</b><span>전체 리스트</span></div><div><b>${ls.filter(l=>l.public).length}</b><span>공개 리스트</span></div><div><b>${ls.reduce((n,l)=>n+(l.views||0),0)}</b><span>브라우저 내 조회수</span></div></div></div><div class="section-head"><h2>내 리스트 <span class="muted tiny">${ls.length}</span></h2><div style="display:flex;gap:7px"><button class="btn" onclick="importStart()">↥ 가져오기</button><button class="btn primary" onclick="createList()">＋ 새 리스트</button></div></div><div class="list-grid">${ls.length?ls.map(l=>card(l,true)).join(''):`<div class="empty"><div class="empty-symbol">＋</div><h3>기록의 시작은 한 편의 영화부터</h3><p>제목을 정하고, 좋아하는 영화를 원하는 티어에 올려 보세요.</p><button class="btn primary" onclick="createList()">새 리스트 만들기</button></div>`}</div><div class="info">ⓘ <div>조회수는 이 브라우저에서 다른 로컬 계정 또는 비로그인 상태로 리스트를 연 횟수입니다. 공유 링크 수신자의 조회수는 원본에 합산되지 않습니다. 계정은 비밀번호 없는 로컬 프로필이며 접근 보안 기능이 아닙니다.</div></div>${footer()}`}
function accountDialog(cb){afterLogin=cb||null;modal(user()?'계정 관리':'로컬 계정으로 시작하기',`<p>계정별로 나만의 리스트를 보관하세요.<br>실제 회원가입이 아닌, 이 브라우저 전용 프로필입니다.</p>${db.users.map(u=>`<button class="account-choice" onclick="login('${u.id}')"><span><span class="avatar">${esc(u.name.slice(0,1))}</span>${esc(u.name)}</span><span class="muted tiny">${u.id===db.current?'현재 계정':'선택 →'}</span></button>`).join('')}<div class="divider">새 로컬 계정 만들기</div><form onsubmit="event.preventDefault();newUser()"><div class="field"><label for="username">사용할 이름</label><input id="username" maxlength="24" placeholder="예: 영화 보는 민수" required autocomplete="off"></div><button class="btn primary" style="width:100%">계정 만들고 시작하기</button><div class="error" id="account-error"></div></form>${user()?'<button class="btn" style="width:100%;margin-top:10px" onclick="logout()">로그아웃</button>':''}<div class="notice" style="margin-top:18px">브라우저 데이터를 지우면 계정과 리스트도 삭제됩니다. 중요한 리스트는 JSON 파일로 내보내 보관하세요. 다른 기기와 자동 동기화되지 않습니다.</div>`)}
function login(uid){if(dirty&&!leave())return;db.current=uid;persist();let cb=afterLogin;closeModal();if(cb)cb();else{if(draft){dirty=false;draft=null;page='mine';shared=false}render()}toast('로컬 계정으로 로그인했습니다')}
function newUser(){let name=$('#username').value.trim();if(!name)return; if(db.users.some(u=>u.name===name)){$('#account-error').textContent='이미 있는 이름입니다. 위에서 계정을 선택하거나 다른 이름을 입력하세요.';return}let u={id:id(),name};db.users.push(u);login(u.id)}
function logout(){if(!leave())return;db.current=null;persist();closeModal();draft=null;page='explore';render();toast('로그아웃했습니다')}
function requireUser(cb){if(user())cb();else accountDialog(cb)}
function createList(){requireUser(()=>{modal('새 티어리스트 만들기',`<p>평가할 영화들을 하나의 제목으로 모아 보세요.</p><form onsubmit="event.preventDefault();finishCreate()"><div class="field"><label for="new-title">리스트 제목</label><input id="new-title" placeholder="예: 올해 본 영화, 나만의 순위" maxlength="100" required></div><label class="switch-label"><input type="checkbox" id="new-public"> 공개 탐색에도 노출하기</label><p class="tiny" style="margin-top:9px">기본은 링크 공유 전용입니다. 언제든 변경할 수 있어요.</p><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">취소</button><button class="btn primary">리스트 만들기</button></div></form>`);})}
function finishCreate(){if(!leave())return;let title=$('#new-title').value.trim();if(!title)return;const l={id:id(),owner:user().id,author:user().name,title,public:$('#new-public').checked,created:Date.now(),updated:Date.now(),views:0,tiers:['S','A','B','C','D','F'].map(name=>({id:id(),name,cards:[]})),pool:[]};db.lists.push(l);persist();closeModal();openList(l.id)}
function openList(uid){if(!leave())return;const l=db.lists.find(l=>l.id===uid);if(!l)return;if(l.owner!==user()?.id){l.views=(l.views||0)+1;persist()}draft=structuredClone(l);shared=false;page='editor';clearHash();render();window.scrollTo(0,0)}
function editable(){return !!draft&&user()?.id===draft.owner&&!shared}
function mark(){dirty=true;let el=$('#save-state');if(el)el.textContent='변경 사항 미저장'}
function syncTitle(){if(editable()&&$('#list-title'))draft.title=$('#list-title').value.trim()||'제목 없는 리스트'}
function saveList(show=true){if(!editable())return false;syncTitle();draft.updated=Date.now();draft.author=user().name;const idx=db.lists.findIndex(l=>l.id===draft.id);if(idx<0)db.lists.push(structuredClone(draft));else db.lists[idx]=structuredClone(draft);const ok=persist();if(ok){dirty=false;if($('#save-state'))$('#save-state').textContent='브라우저에 저장됨';if(show)toast('리스트를 저장했습니다')}return ok}
function renderEditor(){let edit=editable();$('#app').innerHTML=`<button class="back" onclick="go('${edit?'mine':'explore'}')">← ${edit?'내 리스트로 돌아가기':'공개 탐색으로 돌아가기'}</button>${!edit?`<div class="copy-notice">${shared?'공유받은 리스트의 스냅샷입니다.':'다른 사용자의 리스트를 보고 있습니다.'} 편집을 시작하면 내 계정에 별도 사본이 만들어져 원본은 바뀌지 않습니다.</div>`:''}<div class="editor-top"><div style="flex:1;width:100%"><div class="eyebrow">${edit?'MY TIER LIST':'MOVIE TIER LIST'}</div><input id="list-title" class="title-input" aria-label="리스트 제목" maxlength="100" value="${esc(draft.title)}" ${edit?'oninput="draft.title=this.value;mark()"':'readonly'}><div class="editor-meta"><span><span class="avatar">${esc(owner(draft).slice(0,1))}</span>${esc(owner(draft))}</span><span id="movie-count">${count(draft)}편의 영화</span><span>조회 ${draft.views||0}${shared?' · 공유 시점 기준':''}</span><span id="save-state">${dirty?'변경 사항 미저장':edit?'브라우저에 저장됨':'읽기 전용'}</span></div></div><div class="editor-actions">${edit?'<button class="btn" onclick="exportDraft()">↧ 내보내기</button><button class="btn" onclick="shareDraft()">↗ 공유</button><button class="btn primary" onclick="saveList()">저장하기</button>':'<button class="btn" onclick="exportDraft()">↧ 내보내기</button><button class="btn primary" onclick="copyToMine()">내 사본으로 편집</button>'}</div></div><div class="edit-bar"><div class="left">${edit?'<button class="btn small" onclick="titleCard()">＋ 제목으로 추가</button><button class="btn small" onclick="document.getElementById(\'image-input\').click()">▧ 이미지 업로드</button><button class="btn small" onclick="addTier()">＋ 티어 추가</button>':'<span class="muted tiny">취향을 살펴보고 나만의 순위로 다시 만들어 보세요.</span>'}</div>${edit?`<label class="switch-label"><input type="checkbox" ${draft.public?'checked':''} onchange="draft.public=this.checked;mark()"> 공개 탐색에 노출</label>`:`<span class="badge ${draft.public?'public':''}">${draft.public?'공개 리스트':'링크로 공유된 리스트'}</span>`}</div><div class="board ${edit?'editable':''}">${draft.tiers.map((t,i)=>tierRow(t,i,edit)).join('')}</div><div class="pool"><div class="pool-head"><h3>배치 대기 <span class="muted tiny">${draft.pool.length}</span></h3><span class="muted tiny">${edit?'영화를 추가한 뒤 원하는 티어로 옮기세요':'아직 티어에 배치하지 않은 영화'}</span></div>${zone(draft.pool,'pool',edit)}</div><div class="bottom-note">${edit?'카드를 드래그해 이동 · 다른 카드의 왼쪽/오른쪽에 놓아 순서 변경 · 티어 이름을 두 번 눌러 수정<br>터치 기기나 키보드에서는 카드의 ↗ 버튼으로 위치와 순서를 바꿀 수 있습니다.':'원본을 수정할 수 없는 열람 화면입니다. 내 사본을 만들어 자유롭게 편집하세요.'}</div>${footer()}`;if(edit)bindDnD()}
function tierRow(t,i,edit){return `<div class="tier-row"><div class="tier-side" style="background:${COLORS[i%6]}"><span class="tier-name" ${edit?`tabindex="0" role="button" title="두 번 클릭하거나 Enter를 눌러 이름 변경" ondblclick="renameTier('${t.id}')" onkeydown="if(event.key==='Enter')renameTier('${t.id}')"`:''}>${esc(t.name)}</span>${edit?`<div class="tier-tools"><button aria-label="${esc(t.name)} 티어 이름 변경" onclick="renameTier('${t.id}')">✎</button><button aria-label="${esc(t.name)} 티어 삭제" onclick="removeTier('${t.id}')">×</button></div>`:''}</div>${zone(t.cards,t.id,edit)}</div>`}
function zone(cards,z,edit){return `<div class="tier-zone" data-zone="${z}">${cards.length?cards.map(c=>movie(c,edit)).join(''):`<span class="tier-hint">${edit?(z==='pool'?'아직 추가한 영화가 없습니다. 제목 또는 이미지로 첫 영화를 추가하세요.':'이곳으로 영화를 드래그하세요'):'등록된 영화가 없습니다'}</span>`}</div>`}
function movie(c,edit){return `<div class="movie-card" data-card="${c.id}" draggable="${edit}" title="${esc(c.title)}">${c.image?`<img src="${esc(c.image)}" alt="${esc(c.title)}" loading="lazy">`:`<span class="movie-text">${esc(c.title)}</span>`}${edit?`<div class="movie-controls"><button aria-label="${esc(c.title)} 이동 및 수정" onclick="cardDialog('${c.id}')">↗</button><button aria-label="${esc(c.title)} 삭제" onclick="removeCard('${c.id}')">×</button></div>`:''}</div>`}
function refreshBoard(){syncTitle();renderEditor()}
function titleCard(){if(!editable())return;modal('영화 제목으로 추가',`<p>검은색 카드에 흰색 글씨로 표시됩니다.</p><form onsubmit="event.preventDefault();addTitleCard()"><div class="field"><label for="movie-title">영화 제목</label><input id="movie-title" maxlength="120" placeholder="영화 제목을 입력하세요" required></div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">취소</button><button class="btn primary">카드 추가</button></div></form>`)}
function addTitleCard(){const title=$('#movie-title').value.trim();if(!title)return;draft.pool.push({id:id(),title});mark();closeModal();refreshBoard();toast('배치 대기에 영화를 추가했습니다')}
function addTier(){modal('티어 추가',`<form onsubmit="event.preventDefault();finishTier()"><div class="field"><label for="tier-name">티어 이름</label><input id="tier-name" maxlength="20" placeholder="예: 다시 보고 싶은 영화" required></div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">취소</button><button class="btn primary">추가</button></div></form>`)}
function finishTier(){const name=$('#tier-name').value.trim();if(!name)return;draft.tiers.push({id:id(),name,cards:[]});mark();closeModal();refreshBoard()}
function renameTier(tid){const t=draft.tiers.find(t=>t.id===tid);modal('티어 이름 변경',`<form onsubmit="event.preventDefault();finishRename('${tid}')"><div class="field"><label for="rename-tier">티어 이름</label><input id="rename-tier" value="${esc(t.name)}" maxlength="20" required></div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">취소</button><button class="btn primary">변경</button></div></form>`)}
function finishRename(tid){const name=$('#rename-tier').value.trim();if(!name)return;draft.tiers.find(t=>t.id===tid).name=name;mark();closeModal();refreshBoard()}
function removeTier(tid){const t=draft.tiers.find(t=>t.id===tid);if(!confirm(`'${t.name}' 티어를 삭제할까요? 영화 ${t.cards.length}편은 배치 대기로 옮깁니다.`))return;draft.pool.push(...t.cards);draft.tiers=draft.tiers.filter(t=>t.id!==tid);mark();refreshBoard()}
function arrays(){return [draft.pool,...draft.tiers.map(t=>t.cards)]}function findCard(cid){for(const arr of arrays()){let index=arr.findIndex(c=>c.id===cid);if(index>=0)return {arr,index,card:arr[index]}}return null}function targetArray(z){return z==='pool'?draft.pool:draft.tiers.find(t=>t.id===z)?.cards}
function removeCard(cid){const found=findCard(cid);if(!found||!confirm(`'${found.card.title}' 카드를 삭제할까요?`))return;found.arr.splice(found.index,1);mark();refreshBoard()}
function cardDialog(cid){const f=findCard(cid);if(!f)return;const current=f.arr===draft.pool?'pool':draft.tiers.find(t=>t.cards===f.arr).id;modal('영화 카드 편집',`<form onsubmit="event.preventDefault();finishCard('${cid}')"><div class="field"><label for="edit-movie">영화 제목 / 이미지 대체 텍스트</label><input id="edit-movie" maxlength="120" value="${esc(f.card.title)}" required></div><div class="field"><label for="move-tier">이동할 티어</label><select id="move-tier" onchange="updatePositions('${cid}')">${[...draft.tiers,{id:'pool',name:'배치 대기'}].map(t=>`<option value="${t.id}" ${current===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label for="move-position">배치 순서</label><select id="move-position"></select></div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">취소</button><button class="btn primary">적용</button></div></form>`);updatePositions(cid,f.index)}
function updatePositions(cid,pos){const arr=targetArray($('#move-tier').value);const len=arr.filter(c=>c.id!==cid).length+1;$('#move-position').innerHTML=Array.from({length:len},(_,i)=>`<option value="${i}" ${pos===i?'selected':''}>${i+1}번째${i===len-1?' (마지막)':''}</option>`).join('')}
function finishCard(cid){const f=findCard(cid),title=$('#edit-movie').value.trim();if(!title)return;f.card.title=title;let c=f.arr.splice(f.index,1)[0];targetArray($('#move-tier').value).splice(Number($('#move-position').value),0,c);mark();closeModal();refreshBoard()}
function bindDnD(){document.querySelectorAll('.movie-card').forEach(el=>{el.addEventListener('dragstart',e=>{if(e.target.closest('button')){e.preventDefault();return}dragId=el.dataset.card;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';el.classList.add('dragging')});el.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.over,.dragging,.insert-before').forEach(e=>e.classList.remove('over','dragging','insert-before'))})});document.querySelectorAll('.tier-zone').forEach(z=>{z.addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.over,.insert-before').forEach(el=>el.classList.remove('over','insert-before'));z.classList.add('over');const c=e.target.closest('.movie-card');if(c&&c.dataset.card!==dragId)c.classList.add('insert-before')});z.addEventListener('dragleave',e=>{if(!z.contains(e.relatedTarget))z.classList.remove('over')});z.addEventListener('drop',e=>{if(!dragId)return;e.preventDefault();e.stopPropagation();const f=findCard(dragId);if(!f)return;const hit=e.target.closest('.movie-card');if(hit?.dataset.card===dragId)return;const c=f.arr.splice(f.index,1)[0],arr=targetArray(z.dataset.zone);let i=hit?arr.findIndex(c=>c.id===hit.dataset.card):arr.length;if(hit&&e.clientX>hit.getBoundingClientRect().left+hit.offsetWidth/2)i++;arr.splice(Math.max(0,i),0,c);dragId=null;mark();refreshBoard()})})}
$('#image-input').addEventListener('change',async e=>{await uploadImages([...e.target.files]);e.target.value=''})
async function uploadImages(files){if(!editable())return;const target=draft;let added=0;for(const f of files){if(!f.type.startsWith('image/')){toast('이미지 파일만 추가할 수 있습니다');continue}if(f.size>20*1024*1024){toast(f.name+': 20MB 이하 이미지만 지원합니다');continue}try{const data=await resizeImage(f);if(draft!==target||!editable())break;draft.pool.push({id:id(),title:f.name.replace(/\.[^.]+$/,'').slice(0,120)||'업로드 이미지',image:data});added++}catch(e){toast(f.name+': 이미지를 읽을 수 없습니다')}}if(added&&draft===target){mark();refreshBoard();toast(`${added}개의 이미지를 추가했습니다. 저장하기를 눌러 보관하세요.`)}}
function resizeImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const ratio=Math.min(1,480/img.width,720/img.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));const ctx=c.getContext('2d');ctx.fillStyle='#111';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(url);resolve(data)}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('image'))};img.src=url})}
window.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();if(editable())$('#drop-upload').style.display='grid'}});window.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('#drop-upload').style.display='none'});window.addEventListener('drop',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();$('#drop-upload').style.display='none';uploadImages([...e.dataTransfer.files])}});
function deleteList(uid){const l=db.lists.find(l=>l.id===uid);if(l?.owner!==user()?.id)return;if(!confirm(`'${l.title}' 리스트를 완전히 삭제할까요?`))return;db.lists=db.lists.filter(l=>l.id!==uid);persist();renderMine();toast('리스트를 삭제했습니다')}
function copyToMine(){const source=structuredClone(draft);requireUser(()=>{const l=structuredClone(source);l.id=id();l.owner=user().id;l.author=user().name;l.public=false;l.created=l.updated=Date.now();l.views=0;db.lists.push(l);persist();draft=structuredClone(l);shared=false;dirty=false;page='editor';clearHash();render();toast('내 계정에 독립된 사본을 만들었습니다. 원본은 그대로 유지됩니다.')})}
function portable(l){return {format:'frame-tierlist',version:1,list:{title:l.title,author:owner(l),public:l.public,created:l.created,updated:l.updated,views:l.views||0,tiers:l.tiers,pool:l.pool}}}
function downloadJSON(l){const blob=new Blob([JSON.stringify(portable(l),null,2)],{type:'application/json'});const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=(l.title.replace(/[\\/:*?"<>|]/g,'_').slice(0,60)||'영화 티어리스트')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('리스트 JSON 파일을 내보냈습니다')}
function exportDraft(){syncTitle();downloadJSON(draft)}
function shareSaved(uid){const l=db.lists.find(l=>l.id===uid);showShare(l)}function shareDraft(){syncTitle();if(dirty&&!saveList(false))return;showShare(draft)}
function encodeData(o){const bytes=new TextEncoder().encode(JSON.stringify(o));let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeData(s){if(s.length>18000000)throw Error('too large');let b=s.replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))))}
let shareList=null;
function showShare(l){shareList=structuredClone(l);const data=encodeData(portable(l)),base=location.href.split('#')[0],fragment='#frame='+data,url=base+fragment;modal('내 취향을 공유하세요',`<p>현재 리스트 내용을 담은 스냅샷 링크입니다. 나중에 수정한 내용은 기존 링크에 반영되지 않습니다.</p><div class="field"><label for="share-url">현재 파일 위치를 포함한 공유 링크</label><input class="share-field" id="share-url" readonly value="${esc(url)}"></div><button class="btn primary" style="width:100%" onclick="copyText(document.getElementById('share-url').value)">링크 복사</button><div class="notice" style="margin-top:16px">로컬 파일의 경로는 상대방 컴퓨터에서 열리지 않습니다. 이 HTML 파일도 함께 전달한 다음, 상대방은 <b>사용 안내 → 공유 코드 열기</b>에 아래 코드를 붙여 넣어야 합니다. JSON 파일로 전달하면 이미지가 많아도 더 안정적입니다.${url.length>8000?'<br><b>이미지가 포함되어 링크가 깁니다. JSON 파일 전달을 권장합니다.</b>':''}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px"><button class="btn" onclick="copyText('#frame='+encodeData(portable(shareList)))">공유 코드 복사</button><button class="btn" onclick="downloadJSON(shareList)">JSON 파일 내보내기</button></div><p class="tiny" style="margin:14px 0 0">공유 데이터에는 제목·작성자 이름·영화 이미지가 포함됩니다. 코드를 가진 사람은 모두 열람할 수 있습니다.</p>`)}
async function copyText(text){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);toast('클립보드에 복사했습니다');return}}catch(e){}const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';const host=$('#modal').open?$('#modal-body'):document.body;host.append(t);t.focus();t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();if(ok)toast('클립보드에 복사했습니다');else modal('직접 복사하기','<p>브라우저가 자동 복사를 허용하지 않습니다. 아래 내용을 전체 선택해 복사하세요.</p><textarea id="manual-copy" style="width:100%;height:180px"></textarea>');if(!ok){$('#manual-copy').value=text;$('#manual-copy').select()}}
function sanitize(raw){if(raw?.format!=='frame-tierlist'||raw.version!==1||!raw.list)throw Error('올바른 프레임 파일이 아닙니다.');const x=raw.list;if(!Array.isArray(x.tiers)||x.tiers.length>100||!Array.isArray(x.pool))throw Error('티어 데이터 형식이 올바르지 않습니다.');let total=0;const cards=arr=>{if(!Array.isArray(arr))throw Error('영화 카드 데이터가 올바르지 않습니다.');total+=arr.length;if(total>3000)throw Error('영화 카드가 너무 많습니다. (최대 3,000개)');return arr.map(c=>{if(!c||typeof c.title!=='string')throw Error('영화 제목이 누락되었습니다.');let o={id:id(),title:c.title.slice(0,120)};if(c.image){if(typeof c.image!=='string'||!/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(c.image))throw Error('지원하지 않는 이미지 데이터입니다.');o.image=c.image}return o})};return {id:id(),owner:null,author:String(x.author||'공유한 사용자').slice(0,24),title:String(x.title||'제목 없는 리스트').slice(0,100),public:!!x.public,created:Number(x.created)||Date.now(),updated:Number(x.updated)||Date.now(),views:Math.max(0,Math.floor(Number(x.views)||0)),tiers:x.tiers.map(t=>({id:id(),name:String(t.name||'티어').slice(0,20),cards:cards(t.cards)})),pool:cards(x.pool)}}
function showImported(raw){let l=sanitize(raw);if(!leave())return;draft=l;shared=true;page='editor';dirty=false;render();window.scrollTo(0,0);toast('공유 리스트를 열었습니다. 내 사본을 만들어 편집할 수 있습니다.')}
function importStart(){$('#import-input').click()}
$('#import-input').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>15*1024*1024)throw Error('15MB 이하의 JSON 파일만 열 수 있습니다.');showImported(JSON.parse(await f.text()))}catch(err){toast('파일을 열 수 없습니다: '+err.message)}e.target.value=''})
function help(){modal('프레임 사용 안내',`<p>설치 없이 사용하는 나만의 영화 티어 보관함입니다.</p><ol class="help-list"><li>로컬 계정을 만들고 새 리스트를 생성하세요.</li><li>영화 제목이나 이미지를 추가하고 원하는 티어에 놓으세요.</li><li>티어 이름은 두 번 클릭하거나 연필 버튼으로 변경하세요.</li><li>편집 후 저장하기를 누르세요. Ctrl / Cmd + S도 사용할 수 있습니다.</li><li>내보낸 JSON 파일은 다른 브라우저에서 가져올 수 있습니다.</li><li>다른 사람의 리스트는 ‘내 사본으로 편집’으로 가져오세요.</li></ol><div class="notice">계정·공개 탐색·조회수는 현재 브라우저 전용입니다. 비밀번호 인증, 온라인 검색, 기기 간 동기화, 전 세계 조회수 집계는 제공되지 않습니다. file:// 저장 동작은 브라우저 설정에 따라 달라질 수 있습니다. 같은 파일 경로에서 사용하고 JSON으로 백업하세요.<br><br>이미지는 개당 20MB 이하이며 최대 480 × 720픽셀 JPEG로 축소됩니다. 저장 공간은 브라우저마다 제한됩니다. 권리가 있는 이미지만 업로드하세요.</div><div class="modal-footer"><button class="btn" onclick="openCodeDialog()">공유 코드 열기</button><button class="btn primary" onclick="closeModal()">확인</button></div>`)}
function openCodeDialog(){modal('공유 코드로 리스트 열기',`<p>전달받은 #frame= 코드 또는 전체 공유 링크를 붙여 넣으세요.</p><textarea id="share-code" style="width:100%;height:140px;padding:12px;border:1px solid #dfe3e9;border-radius:9px;resize:vertical" placeholder="#frame=…" aria-label="공유 코드"></textarea><div id="code-error" class="error"></div><div class="modal-footer"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="openCode()">리스트 열기</button></div>`)}
function openCode(){try{const text=$('#share-code').value.trim(),m=text.match(/#frame=([A-Za-z0-9_-]+)/);if(!m)throw Error('올바른 #frame= 코드를 입력하세요.');const raw=decodeData(m[1]);sanitize(raw);if(dirty&&!confirm('미저장 변경 사항을 버리고 공유 리스트를 열까요?'))return;dirty=false;closeModal();showImported(raw)}catch(e){$('#code-error').textContent='열 수 없습니다: '+e.message}}
function readHash(){if(!location.hash.startsWith('#frame='))return false;try{showImported(decodeData(location.hash.slice(7)));return true}catch(e){toast('공유 링크가 손상되었거나 너무 큽니다. JSON 파일로 가져와 주세요.');return false}}
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#frame='))readHash()});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&editable()){e.preventDefault();saveList()}});
render();if(location.hash.startsWith('#frame='))readHash();
</script>
</body></html>
